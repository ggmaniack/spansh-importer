# Included from F:\pgdata\postgresql.conf. Tuned for bulk loading on a 32 GB / 16-thread box.
listen_addresses = 'localhost'
port = 5432
max_connections = 50

shared_buffers = 8GB
effective_cache_size = 20GB
work_mem = 64MB
maintenance_work_mem = 2GB
max_parallel_maintenance_workers = 8
max_worker_processes = 16
max_parallel_workers = 16

# minimal WAL lets COPY into a table created/truncated in the same transaction skip WAL entirely
wal_level = minimal
max_wal_senders = 0
wal_buffers = 64MB
wal_compression = lz4
max_wal_size = 32GB
min_wal_size = 4GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9

# durability stays on: fsync and synchronous_commit are left at their defaults
random_page_cost = 1.1
effective_io_concurrency = 200

logging_collector = on
log_directory = 'log'
log_checkpoints = on
log_min_duration_statement = 5000
lc_messages = 'C'
