[package]
name = "spansh-importer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Streams the Spansh Elite Dangerous galaxy dump into normalized PostgreSQL"
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
native-tls = "0.2.18"
postgres = "0.19.14"
postgres-native-tls = "0.5.3"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[profile.release]
debug = "line-tables-only"  # keeps symbols for profiling

[dev-dependencies]
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
